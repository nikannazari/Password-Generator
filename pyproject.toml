[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "password-generator"
version = "1.0.0"
description = "A modular password generator built with Python and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nikan Nazari" }
]
dependencies = [
    "streamlit>=1.40"
]


[tool.setuptools.packages.find]
where = ["src"]